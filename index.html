<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My PDF Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            line-height: 1.6;
        }

        header {
            background: #24292f;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        header p {
            color: #d0d7de;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0969da;
        }

        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(250px, 1fr));
            gap: 20px;
        }

        .pdf-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pdf-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .pdf-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .pdf-card h3 {
            margin-bottom: 8px;
            font-size: 19px;
            word-break: break-word;
        }

        .pdf-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .view-btn {
            background: #0969da;
            color: white;
        }

        .download-btn {
            background: #eaeef2;
            color: #24292f;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .message {
            text-align: center;
            color: #777;
            margin-top: 30px;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .container {
                margin-top: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }

        }
    </style>
</head>

<body>

    <header>
        <h1>📚 My PDF Library</h1>
        <p>Browse and download my documents</p>
    </header>


    <main class="container">

        <div class="search-box">

            <input type="search" id="searchInput" placeholder="Search PDFs..." autocomplete="off">

        </div>


        <div class="pdf-grid" id="pdfGrid">
        </div>


        <div class="message" id="message">
            Loading PDFs...
        </div>

    </main>


    <footer>
        © 2026 My PDF Library
    </footer>


    <script>

        const PDF_FOLDER = "stays/";


        let pdfFiles = [];


        /*
         * Convert filename to readable title.
         *
         * Example:
         *
         * my-hotel-booking.pdf
         *
         * becomes:
         *
         * My Hotel Booking
         */

        function formatTitle(filename) {

            return filename
                .replace(/\.pdf$/i, "")
                .replace(/[-_]+/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .replace(/\b\w/g, function (char) {
                    return char.toUpperCase();
                });

        }


        /*
         * Get PDF files from /stays/
         */

        async function loadPDFs() {

            const message =
                document.getElementById("message");


            try {

                const response =
                    await fetch(PDF_FOLDER);


                if (!response.ok) {
                    throw new Error(
                        "Could not access the stays folder."
                    );
                }


                const html =
                    await response.text();


                /*
                 * Parse directory listing HTML
                 */

                const parser =
                    new DOMParser();


                const documentHTML =
                    parser.parseFromString(
                        html,
                        "text/html"
                    );


                /*
                 * Find all links ending in .pdf
                 */

                const links =
                    documentHTML.querySelectorAll("a");


                pdfFiles = [];


                links.forEach(function (link) {

                    const href =
                        link.getAttribute("href");


                    if (!href) {
                        return;
                    }


                    /*
                     * Only accept PDF files.
                     */

                    if (
                        href
                            .split("?")[0]
                            .toLowerCase()
                            .endsWith(".pdf")
                    ) {

                        /*
                         * Get filename from URL.
                         */

                        const filename =
                            decodeURIComponent(
                                href.split("/").pop()
                            );


                        if (filename) {

                            pdfFiles.push(filename);

                        }

                    }

                });


                /*
                 * Remove duplicates
                 */

                pdfFiles =
                    [...new Set(pdfFiles)];


                /*
                 * Sort alphabetically
                 */

                pdfFiles.sort(
                    (a, b) =>
                        a.localeCompare(
                            b,
                            undefined,
                            {
                                numeric: true,
                                sensitivity: "base"
                            }
                        )
                );


                renderPDFs(pdfFiles);


                if (pdfFiles.length === 0) {

                    message.textContent =
                        "No PDF files found in stays/";

                } else {

                    message.style.display =
                        "none";

                }

            }
            catch (error) {

                console.error(error);


                message.textContent =
                    "Unable to load PDFs from stays/. " +
                    "Make sure directory listing is enabled.";

            }

        }


        /*
         * Create PDF card
         */

        function createPDFCard(filename) {

            const url =
                PDF_FOLDER +
                encodeURIComponent(filename);


            const card =
                document.createElement("div");

            card.className =
                "pdf-card";


            const icon =
                document.createElement("div");

            icon.className =
                "pdf-icon";

            icon.textContent =
                "📄";


            const title =
                document.createElement("h3");

            title.textContent =
                formatTitle(filename);


            const description =
                document.createElement("p");

            description.textContent =
                "PDF document";


            const buttons =
                document.createElement("div");

            buttons.className =
                "buttons";


            /*
             * Native browser PDF viewer
             */

            const viewButton =
                document.createElement("a");

            viewButton.href =
                url;

            viewButton.target =
                "_blank";

            viewButton.rel =
                "noopener";

            viewButton.className =
                "btn view-btn";

            viewButton.textContent =
                "View PDF";


            /*
             * Download
             */

            const downloadButton =
                document.createElement("a");

            downloadButton.href =
                url;

            downloadButton.download =
                filename;

            downloadButton.className =
                "btn download-btn";

            downloadButton.textContent =
                "Download";


            buttons.appendChild(
                viewButton
            );

            buttons.appendChild(
                downloadButton
            );


            card.appendChild(icon);
            card.appendChild(title);
            card.appendChild(description);
            card.appendChild(buttons);


            return card;

        }


        /*
         * Render PDF cards
         */

        function renderPDFs(files) {

            const grid =
                document.getElementById(
                    "pdfGrid"
                );


            grid.innerHTML = "";


            files.forEach(function (filename) {

                grid.appendChild(
                    createPDFCard(filename)
                );

            });

        }


        /*
         * Search
         */

        function searchPDFs() {

            const query =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();


            const filtered =
                pdfFiles.filter(
                    function (filename) {

                        return formatTitle(filename)
                            .toLowerCase()
                            .includes(query);

                    }
                );


            renderPDFs(filtered);


            const message =
                document.getElementById(
                    "message"
                );


            if (
                pdfFiles.length > 0 &&
                filtered.length === 0
            ) {

                message.textContent =
                    "No PDFs found.";

                message.style.display =
                    "block";

            } else {

                message.style.display =
                    "none";

            }

        }


        /*
         * Search as user types
         */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                searchPDFs
            );


        /*
         * Start
         */

        loadPDFs();

    </script>

</body>

</html>
